  <h2>Part 3. DOM Manipulation</h2>

  <!-- Task 5 -->
  <h3>Task 5. Add & Remove Elements</h3>
  <button id="btn-add-append">Append Item</button>
  <button id="btn-add-prepend">Prepend Item</button>
  <button id="btn-remove">Remove Last Item</button>
  <ul id="my-list">
    <li>Item 1</li>
  </ul>

  <!-- Task 6 -->
  <h3>Task 6. Modifying Attributes</h3>
  <img id="attr-img" src="https://via.placeholder.com/200/ff0000" alt="Red">
  <button id="btn-change-src">Change Image Source</button>
  <br><br>
  <a id="attr-link" href="https://google.com" target="_blank">Go to Google</a>
  <br><br>
  <button id="btn-change-href">Change Link Destination</button>

  <!-- Task 7 -->
  <h3>Task 7. Form Interaction</h3>
  <form id="user-form">
    <input type="text" id="input-name" placeholder="Name"><br><br>
    <input type="email" id="input-email" placeholder="Email">
  </form>
  <div>
    <p>Name: <span id="out-name"></span></p>
    <p>Email: <span id="out-email"></span></p>
  </div>
